<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <STYLE>
        div#conteiner{
            display: flex;
            background-color: rgba(165, 42, 42, 0.39);
            height: 500px;
            flex-flow: row nowrap;
            justify-content: center;
            align-items: center;
        }
        div.item{
            width: 200px;
            height: 200px;
            border: 1px solid black;
            text-align: center;
            border-radius: 10px;
        }
    </STYLE>
</head>
<body>
    <div id="conteiner">
        <div class="item">A</div>
    </div>
</body>
</html>
