<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body>
    
    <div>
        <p>Clique no botão</p>
    </div>
    <div>
        <input type="button" value="Mudar" onclick="mudar()">
    </div>

    <script>



        function mudar() {
            document.querySelector('p').textContent = 'Olá, mundo!'
        }
    </script>

</body>
</html>
