<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de idade</title>
</head>
<body>
    <div>
        <label for="idade">Digite o ano de seu nascimento: </label>
        <input type="number" id="idade">
    </div>    
    <div>
        <input type="button" value="Verificar" onclick="verificar()">
    </div>
    <div id="res"></div>
    
    <script>
        let res = document.querySelector('div#res')
        let anoatual = new Date().getFullYear()

        function verificar() {
            let anonasc = Number(document.querySelector('input#idade').value)
            let idade = anoatual - anonasc
            if (idade < 18) {
                res.innerHTML = `Menor de idade, ${idade} anos`
            } else {
                res.innerHTML = `Maior de idade, ${idade} anos`
            }
        }
    </script>

</body>
</html>
