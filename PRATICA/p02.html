<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .hiden{
            display: none;
        }
    </style>

</head>
<body>
    <main>
        <div>
            <label for="nome">Olá, digite seu nome: </label>
            <input type="text" id="nome">
        </div>
        <div>
            <label for="idade">Digite sua idade: </label>
            <input type="number" id="idade">
        </div>
        <div>
            <input type="button" value="Avaliar" onclick="avaliar()">
        </div>
        <div id="res1">
            
        </div>
        <div class="hiden">
            <label for="end">Informe seu endereço: </label>
            <input type="text" id="end">
        </div>
        <div>
            <input type="button" value="Enviar" onclick="carregar()">
        </div>
        <div id="res2">

        </div>
    </main>  
    
    <script>
        function avaliar() {
            let res1 = document.querySelector('div#res1')
            let nome = (document.querySelector('input#nome').value)
            let idade = Number(document.querySelector('input#idade').value)

            res1.innerHTML += `Olá, ${nome.toUpperCase()}, seja bem vindo! <br>`

            if (idade < 18) {
                res1.innerHTML += `Você não possui idade mínima para dirigir!`
            } else {
                res1.innerHTML += `Continue o cadastro`
                document.querySelector('.hiden').style.display = "block"

            }
        }
            function carregar() {
            let nome = (document.querySelector('input#nome').value)
            let idade = Number(document.querySelector('input#idade').value)
            let res2 = document.querySelector('div#res2')
            let end = document.querySelector('input#end').value
            
            res2.innerHTML = `${nome}, possui ${idade} anos, morador da cidade de ${end}.`
        }
        

    </script>
</body>
</html>
