<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de notas</title>
</head>
<body>
    <h1>Calculadora de notas</h1>
    <form action="" method="post">
        <fieldset>
            <legend>Média</legend>

            <p>
                <label for="n1">Nota 1: </label>
                <input type="number" name="" id="n1">
            </p>
            <p>
                <label for="n2">Nota 2: </label>
                <input type="number" name="" id="n2">
            </p>
            <p>
                <label for="n3">Nota 3: </label>
                <input type="number" name="" id="n3">
            </p>
            <p>
                <input type="button" value="Calcular" onclick="calcular()">
            </p>
            <div id="res"></div>

        </fieldset>
    </form> 
    
    <script>

        let num1 = document.querySelector('input#n1')
        let num2 = document.querySelector('input#n2')
        let num3 = document.querySelector('input#n3')
     
        function calcular() {

        if (num1.value == "" || num2.value == "" || num3.value == "") {
            alert('[ERRO] Faltam dados!')
        } else {

            let res = document.querySelector('div#res')
            
            let n1 = Number(num1.value)
            let n2 = Number(num2.value)
            let n3 = Number(num3.value)

            var m = (n1+n2+n3)/3

            res.innerHTML = `A média é de: ${m}`
        }
        }

    </script>

</body>
</html>
