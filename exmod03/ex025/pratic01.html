<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>

</head>
<body>
    <h1 style="text-align: center;">Lista de compras</h1>

    <form method="post">
        <fieldset>
            <legend>Lista de compras</legend>
            <p>
                <label for="compra">Item:</label>
                <input type="text" id="compra" required>
            </p>
            <p>
                <label for="quant">Quantidade: </label>
                <input type="number" id="quant" required>
            </p>
            <p>
                <label for="val">Valor un: </label>
                <input type="number" id="val" required>
            </p>
                <input type="button" value="Adicionar" onclick="adicionar()">
            <p>
                <fieldset>
                    <legend>Itens</legend>
                    <ul id="res">
                          
                    </ul>
                </fieldset>
            <p>
                <input type="button" value="Calcular" onclick="calcular()">
            </p>
            <div id="res2"></div>

            <p>
                <input type="button" value="Limpar" onclick="limpar()" style="position: relative;left: 50%;">
            </p>
            
    </form>    

    <script>
          
        let res = document.querySelector('ul#res')
        let res2 = document.querySelector('div#res2')
        let item = document.querySelector('input#compra')
        let quant = document.querySelector('input#quant')
        let valun = document.querySelector('input#val')
        let valortot = 0
        
        function adicionar() {
        if (item.value == "" || quant.value == "" || valun.value == "") {
            alert('[ERRO] Informação faltando!')
        } else {
                let itens = document.querySelector('input#compra').value
                let quantidade = Number(quant.value)
                let valorunitario = Number(valun.value)
                
                res.innerHTML += `${quantidade} ${itens.toUpperCase()}(S) por R$${valorunitario} cada <br>`

                var quantUN = quantidade * valorunitario

                valortot = valortot + quantUN
                
                item.value = ""
                item.focus()
                quant.value = ""
                valun.value = ""
            }
        }
        function limpar() {
                res.innerHTML = ""
                res2.innerHTML = ""
        }

        function calcular () {

            res2.innerHTML = `Valor total das compras = R$${valortot}`
        }

    </script>
</body>
</html>
