<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jun Ken Po</title>

    <style>

        *{
            margin: 0;
        }

        body{
            background-color: rgba(255, 105, 180, 0.425);
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            justify-content: center;
            height: 100dvh;
        }

        header{
            background: white;
            color: black;
            padding: 10px;
        }
        footer{
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            text-align: center;
            background-color: black;
            color: white;
            padding: 10px;
        }

        section > h1{
            background: linear-gradient(to top, rgba(255, 105, 180, 0.027), white);
            color: black;
            padding: 10px;
        }


        .linha{
            display: inline;
            margin: auto;
        }

        .linha img{
            width: 35vw;
            max-width: 350px;
            height: auto;
        }

        #botao > button{
           padding: 10px; 
           margin: 40px 10px 60px 10px;
           background: lightpink;
           border: 1px solid rgba(192, 192, 192, 0.342);
           font-weight: bolder;
           width: 70px;
           box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.479);
        }

        #botao > button:hover{
            background: linear-gradient(to bottom, lightpink, white );
            border: 0.1px solid black;
        }

        div#res{
            border: 2px solid black;
            width: 70px;
            padding: 10px;
            border-radius: 30%;
            background: lightpink;
            font-weight: bolder;
        }

        div#cont{
            margin: 40px;
        }

        @keyframes balancar {
            0% {transform: rotate(0deg);}
            25% {transform: rotate(20deg);}
            50% {transform: rotate(-20deg);}
            75% {transform: rotate(12deg);}
            100% {transform: rotate(0deg);}
        }   

        .balanco {
            animation: balancar 2s ease;
        }


        img{
            filter: brightness(1.1) contrast(1.2);
            mix-blend-mode: multiply;
        }


    </style>

</head>
<body>
    <header>
        <h1>Pedra - Papel - Tesoura</h1>
    </header>

    <section>
        <h1>Good Luck</h1>

        <p id="botao">   
            <button onclick="pedra()">Rock</button>
            <button onclick="papel()">Papel</button>
            <button onclick="tesoura()">Scissor</button>
        </p>

            <div id="maquina"></div>

            <div class="linha">

                <img id="jogo" src="imagens/pedraleft.png" alt="">

                <div id="res" class="linha"  ></div>

                <img id="jogo2" src="imagens/pedraright.png" alt="">

            </div>
            <div id="cont">
                Vitória: <div class="linha" id="vitoria">0</div>
                | Derrota: <div class="linha" id="derrota">0</div>
                | Empate: <div class="linha" id="empate">0</div>
            </div>
            <div id="botao" style="text-align: left;">
                <button onclick="limpar()">Restart</button>
            </div>

            <footer>
                <p>Desenvolvido por <strong>Fragata</strong></p>
            </footer>
            
        
    </section>
    


    <script>           

            const maquina = document.querySelector('div#maquina')
            const res = document.querySelector('div#res')
            const img = document.querySelector('img#jogo')
            const img2 = document.querySelector('img#jogo2')

            let vit = document.querySelector('div#vitoria')
            let der = document.querySelector('div#derrota')
            let emp = document.querySelector('div#empate')

            let contadorVitoria = 0
            let contadorDerrota = 0
            let contadorEmpate = 0

            res.innerHTML = 'Result!'


            function pedra() {

            const numberVariable = Math.random()
            img.src = "imagens/pedraleft.png"
            img2.src = "imagens/pedraright.png"
            animar(img);
            animar(img2);
            

            if (numberVariable >= 0 && numberVariable <= 1/3) {
                img2.src = 'imagens/pedraright.png'
                maquina.innerHTML = 'Rock'
                res.innerHTML = 'Draw!'

                contadorEmpate++
                emp.innerHTML = `${contadorEmpate}`

            } else if (numberVariable <= 2/3) {
                img2.src = 'imagens/papelright.png'
                maquina.innerHTML = 'Paper'
                res.innerHTML = 'Lose!'

                contadorDerrota++
                der.innerHTML = `${contadorDerrota}`

            } else if (numberVariable <= 3/3) {
                img2.src = 'imagens/tesouraright.png'
                maquina.innerHTML = 'Scissor'
                res.innerHTML = 'Win!'

                contadorVitoria++
                vit.innerHTML = `${contadorVitoria}`

            }
        }

        function papel() {

            const numberVariable = Math.random()
            img.src = "imagens/pedraleft.png"
            img2.src = "imagens/pedraright.png"
            animar(img);
            animar(img2);

            img.src = "imagens/papelleft.png"

            if (numberVariable >= 0 && numberVariable <= 1/3) {
                img2.src = 'imagens/pedraright.png'
                maquina.innerHTML = 'Rock'
                res.innerHTML = 'Win!'

                contadorVitoria++
                vit.innerHTML = `${contadorVitoria}`

            } else if (numberVariable <= 2/3) {
                img2.src = 'imagens/papelright.png'
                maquina.innerHTML = 'Paper'
                res.innerHTML = 'Draw!'

                contadorEmpate++
                emp.innerHTML = `${contadorEmpate}`

            } else if (numberVariable <= 3/3) {
                img2.src = 'imagens/tesouraright.png'
                maquina.innerHTML = 'Scissor'
                res.innerHTML = 'Lose!'

                contadorDerrota++
                der.innerHTML = `${contadorDerrota}`
            }
        }

        function tesoura() {

            const numberVariable = Math.random()
            img.src = "imagens/pedraleft.png"
            img2.src = "imagens/pedraright.png"
            animar(img);
            animar(img2);
            
            img.src = "imagens/tesouraleft.png"

            if (numberVariable >= 0 && numberVariable <= 1/3) {
                img2.src = 'imagens/pedraright.png'
                maquina.innerHTML = 'Rock'
                res.innerHTML = 'Lose!'

                contadorDerrota++
                der.innerHTML = `${contadorDerrota}`

            } else if (numberVariable <= 2/3) {
                img2.src = 'imagens/papelright.png'
                maquina.innerHTML = 'Paper'
                res.innerHTML = 'Win!'

                contadorVitoria++
                vit.innerHTML = `${contadorVitoria}`

            } else if (numberVariable <= 3/3) {
                img2.src = 'imagens/tesouraright.png'
                maquina.innerHTML = 'Scissor'
                res.innerHTML = 'Draw!'

                contadorEmpate++
                emp.innerHTML = `${contadorEmpate}`

            }
        }

        function animar(img) {
            img.classList.add("balanco");
            img.addEventListener("animationend", () => {img.classList.remove("balanco");},{once: true});
        }


        function limpar() {
            contadorVitoria = 0
            vit.innerHTML = `${contadorVitoria}`
            contadorDerrota = 0
            der.innerHTML = `${contadorDerrota}`
            contadorEmpate = 0
            emp.innerHTML = `${contadorEmpate}`

            img.src = "imagens/pedraleft.png"
            img2.src = "imagens/pedraright.png"
        }

    </script>

</body>
</html>
