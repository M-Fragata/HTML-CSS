<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>Exemplo de Formulário</h1>

    <form action="cadastro.php" method="post">

        <fieldset>
            <legend>Cálculo de nascimento</legend>

            <p>
                <label for="ano">Ano de nascimento: </label>
                <input type="number" name="ano" id="ano" min="1900" max="2025" value="2000" oninput="calcidade()">
            </p>
            <p>
                <label for="idade">Sua idade é:</label>
                <output id="idade">0</output>
            </p>
        </fieldset>

        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">

    </form>
    
    <script>
        function calcidade(){
            let anoatual = new Date().getFullYear()
            let idade = document.querySelector('output#idade')
            

            let num = document.querySelector('input#ano')
            let anonasc = Number(num.value)
            let res = anoatual - anonasc
            idade.innerHTML = `${res}`        
        }
    </script>

</body>
</html>
