<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário006</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="cadastro.php" method="get">
        <fieldset>
            <legend>Learning</legend>
            <p>
                <label for="cor">Cor: </label>
                <input type="color" name="cor" id="cor" value="#00ff00">
            </p>
            <p>
                <label for="nivel">Nível de satisfação: </label>
                <input type="range" name="nivel" id="nivel" min="0" max="10">
            </p>
            <p>
                <label for="foto">Foto de perfil: </label>
                <input type="file" name="foto" id="foto">
                <!-- Precisa ser utilizado o method "POST" -->
            </p>
        </fieldset>    
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>    
</body>
</html>
