<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form method="post" onsubmit="enviarSenha(event)">
        <p>
            <label for="mail">Insira seu E-mail: </label>
            <input type="email" name="" id="mail">
        </p>
        <p>
            <input type="submit" value="Gerar e enviar senha">
        </p>
    </form>  
    <div id="res"></div> 
    
    <script>
        async function enviarSenha(e) {
            e.preventDefault()
            const email = document.querySelector('input#mail').value

            let res = document.querySelector('div#res')

            const response = await fetch("http://localhost:3000/enviar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email })
      })

            const data = await response.json()
            res.innerHTML = data.message
    }      
    </script>

</body>
</html>
